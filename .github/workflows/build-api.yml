name: Build API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'docker/**'
      - 'db/**'
      - '.github/workflows/build-api.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The API image serves the frontend build as its landing page (public/).
      # Building it here keeps that page in sync with frontend/ automatically.
      - name: Build landing page from frontend
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'https://losung.konfi-quest.de' }}
          REACT_APP_API_KEY: ${{ secrets.REACT_APP_API_KEY }}
          REACT_APP_AUTH_USER: ${{ secrets.REACT_APP_AUTH_USER }}
          REACT_APP_AUTH_PASSWORD: ${{ secrets.REACT_APP_AUTH_PASSWORD }}
          GENERATE_SOURCEMAP: 'false'
          CI: 'false'
        run: |
          npm ci
          npm run build
          rm -rf ../public
          cp -R build ../public

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Stack Webhook
        if: success()
        run: |
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK }}" \
            --fail --silent --show-error || echo "Webhook failed but continuing..."
